name: Build Manifesto PDF (Canonical)

on:
  push:
    branches:
      - main
    paths:
      - 'docs/manifesto/**'
      - 'canon/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pandoc/actions/setup@v1

      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-latex-recommended

      - name: Build PDF
        run: |
          pandoc docs/manifesto/MANIFESTO.md \
            -o MANIFESTO.pdf \
            --pdf-engine=xelatex

      - name: Verify PDF Exists
        run: |
          ls -lah
          test -f MANIFESTO.pdf

      - name: Generate SHA256
        run: sha256sum MANIFESTO.pdf > MANIFESTO.pdf.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cidade-bonfim-manifesto
          path: |
            MANIFESTO.pdf
            MANIFESTO.pdf.sha256

